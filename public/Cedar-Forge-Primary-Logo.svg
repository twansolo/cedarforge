<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Cedar Forge primary logo</title>
  <desc id="desc">A geometric CF monogram shaped like a live data-center rack beside the Cedar Forge wordmark.</desc>
  <rect width="1280" height="320" fill="#F4F5F1"/>
  <g transform="translate(54 52)">
    <!-- C: the blackened-steel data hall / rack enclosure -->
    <path d="M198 0H70C31.3 0 0 31.3 0 70v76c0 38.7 31.3 70 70 70h128v-40H74c-18.8 0-34-15.2-34-34V74c0-18.8 15.2-34 34-34h124z" fill="#0B0E0C"/>
    <path d="M57 53h14v110H57z" fill="#0B0E0C" opacity=".18"/>
    <!-- F: three connected server blades -->
    <path d="M78 59h34v140H78z" fill="#168447"/>
    <rect x="78" y="59" width="120" height="36" rx="2" fill="#168447"/>
    <rect x="78" y="109" width="98" height="36" rx="2" fill="#168447"/>
    <!-- ventilation slots and live status signals -->
    <g fill="#0B0E0C" opacity=".52">
      <rect x="92" y="70" width="54" height="4" rx="2"/><rect x="92" y="80" width="38" height="4" rx="2"/>
      <rect x="92" y="120" width="42" height="4" rx="2"/><rect x="92" y="130" width="29" height="4" rx="2"/>
    </g>
    <g fill="#7CFFAC">
      <circle cx="185" cy="72" r="4"/><circle cx="185" cy="83" r="4"/>
      <circle cx="163" cy="122" r="4"/><circle cx="163" cy="133" r="4"/>
    </g>
  </g>
  <g fill="#0B0E0C">
    <text x="320" y="153" font-family="Manrope, Arial, sans-serif" font-size="84" font-weight="750" letter-spacing="7">CEDAR FORGE<tspan fill="#168447">.AI</tspan></text>
    <rect x="325" y="193" width="72" height="4" fill="#168447"/>
    <text x="420" y="204" font-family="'DM Mono', monospace" font-size="19" font-weight="500" letter-spacing="7">INTELLIGENT GROWTH SYSTEMS</text>
  </g>
</svg>
